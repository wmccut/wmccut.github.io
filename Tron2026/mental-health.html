        /* =========================

        .navbar {

            display: flex;

           ========================= */

           ========================= */

        }

            font-size: 30px;
            font-weight: normal;
            line-height: 1.2;
        }

        .section-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 78px;

        }

            padding-top: 150px; }


        /* =========================
           EXPLANATION BOX
           ========================= */

        .description {
            background: #ccc;

            border-radius: 8px;

            min-height: 390px;
            padding: 24px 14px;

            color: #3f3f3f;

            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.55;
        }


        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 850px) {

            .navbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .nav-links {
                gap: 10px 16px;
            }

            main {
                width: calc(100% - 30px);
                margin-top: 40px;
            }

            .section-content {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .description {
                min-height: auto;
            }
